<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.site_name|default:"نظام الانتظار الذكي" }}</title>
    
    {% if settings.logo %}
    <link rel="icon" href="{{ settings.logo.url }}">
    {% endif %}

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-color: {{ settings.primary_color|default:"#2C3E50" }};
            --secondary-color: {{ settings.secondary_color|default:"#D35400" }};
            --dark-surface: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            min-height: 100vh;
            background-color: #f1f5f9;
            margin: 0 !important;
            padding: 0 !important;
            {% if settings.background_image %}
            background: linear-gradient(rgba(15, 23, 42, 0.05), rgba(15, 23, 42, 0.05)), url('{{ settings.background_image.url }}') no-repeat center center fixed;
            background-size: cover;
            {% endif %}
            color: #1e293b;
        }

        .modal-backdrop { z-index: 1040 !important; }
        .modal { z-index: 1050 !important; }

        .glass-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- الهيدر المطور --- */
        .main-nav {
            background: linear-gradient(135deg, var(--primary-color) 0%, #111827 100%);
            padding: 12px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-bottom: 4px solid var(--secondary-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-wrapper h4 {
            color: #ffffff;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* --- الساعة الرقمية المتطورة --- */
        #digital-clock-wrapper {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 20px;
            border-radius: 16px;
            border-right: 4px solid var(--secondary-color);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
        }

        #digital-clock-wrapper:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .clock-details {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        #digital-clock {
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 700;
            line-height: 1.1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .small-date {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.75);
            margin-top: 3px;
            font-weight: 600;
        }

        /* --- شريط التنويهات السفلي المطور --- */
        .announcement-bar-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 54px;
            background: linear-gradient(90deg, #1e293b, #0f172a);
            border-top: 4px solid var(--secondary-color);
            display: flex;
            align-items: center;
            z-index: 9999;
            direction: rtl;
            box-shadow: 0 -10px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .announcement-icon-badge {
            background: var(--secondary-color);
            color: white;
            height: 100%;
            padding: 0 28px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.25rem;
            z-index: 10;
            box-shadow: 12px 0 25px rgba(0,0,0,0.4);
        }

        .announcement-icon-badge i {
            font-size: 1.35rem;
        }

        .marquee-marquee-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            height: 100%;
        }

        .marquee-scroller {
            white-space: nowrap;
            position: absolute;
            padding-right: 100%;
            color: #f8fafc;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            animation: marquee-fade-in-out 30s linear infinite;
        }

        @keyframes marquee-fade-in-out {
            0% { transform: translate3d(100%, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .marquee-marquee-container:hover .marquee-scroller {
            animation-play-state: paused;
        }

        /* --- منطقة المحتوى الأساسية --- */
        .content-area {
            flex-grow: 1;
            padding: 30px 15px 100px 15px;
        }

        /* تعديل الحاوية التلقائية بداخل الصفحات حتى لا تتدخل مع بار التنبيهات */
        .display-wrapper {
            height: calc(92vh - 54px) !important;
            margin-bottom: 54px;
        }

        /* المكونات العامة المساعدة */
        .pulse-icon { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .btn-main {
            background: var(--secondary-color) !important;
            color: white !important;
            border: none !important;
            padding: 14px 28px !important;
            border-radius: 16px !important;
            font-size: 1.15rem !important;
            font-weight: 700 !important;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
            opacity: 0.95;
        }
    </style>
</head>
<body hx-boost="true">

    <div class="glass-container">
        <nav class="main-nav animate__animated animate__fadeInDown">
            <div class="container d-flex justify-content-between align-items-center">
                <a href="/" class="text-decoration-none d-flex align-items-center brand-wrapper">
                    {% if settings.logo %}
                        <img src="{{ settings.logo.url }}" alt="Logo" style="max-height: 46px; border-radius: 10px;" class="me-2 bg-white p-1 shadow-sm">
                    {% endif %}
                    <h4 class="mb-0 ms-2">{{ settings.site_name|default:"نظام الانتظار" }}</h4>
                </a>

                <div id="digital-clock-wrapper" class="d-flex align-items-center">
                    <div class="clock-details">
                        <div id="digital-clock">--:--:--</div>
                        <div id="digital-date" class="small-date">جاري التحميل...</div>
                    </div>
                </div>
            </div>
        </nav>

        <main id="main-content" class="container content-area animate__animated animate__fadeIn">
            {% block content %}{% endblock %}
        </main>

        <div class="announcement-bar-wrapper">
            <div class="announcement-icon-badge">
                <i class="fas fa-bullhorn animate__animated animate__swing animate__infinite"></i>
                <span>تنويه</span>
            </div>
            <div class="marquee-marquee-container">
                <div class="marquee-scroller" id="announcement-text-target">
                    {{ settings.announcement_text|default:"مرحباً بكم في نظام إدارة الانتظار الرقمي الذكي" }}
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // دالة تحديث الساعة العلوية وتنسيقها باللغة العربية المتزنة
        function updateClock() {
            const now = new Date();
            
            // تنسيق الوقت المباشر الرقمي
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const timeString = now.toLocaleTimeString('ar-EG', timeOptions);
            
            // تنسيق التاريخ واليوم الجاري بصياغة فصيحة
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            const dateString = now.toLocaleDateString('ar-EG', dateOptions);

            const clockEl = document.getElementById('digital-clock');
            const dateEl = document.getElementById('digital-date');

            if(clockEl) clockEl.innerText = timeString;
            if(dateEl) dateEl.innerText = dateString;
        }

        // تشغيل مراقبة الساعة
        setInterval(updateClock, 1000);
        updateClock();

        // إعادة تشغيل المزامنة عند تبديل الصفحات بـ HTMX لمنع توقف العداد
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            updateClock();
        });

        // قراءة النص الأصلي القادم من قاعدة البيانات لعمل الاستبدال اللحظي
        const rawAnnouncementText = `{{ settings.announcement_text|default:"مرحباً بكم.. اليوم هو [date] والساعة الآن [time]" }}`;

        function updateAnnouncementPlaceholders() {
            const targetElement = document.getElementById('announcement-text-target');
            if (!targetElement) return;

            const now = new Date();

            // صياغة الوقت الديناميكي للشريط
            const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
            const formattedTime = now.toLocaleTimeString('ar-EG', timeOptions);

            // صياغة التاريخ الديناميكي للشريط
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const formattedDate = now.toLocaleDateString('ar-EG', dateOptions);

            // استبدال الأكواد البرمجية بنصوص ملونة ومميزة داخل الشريط بشكل آمن وجذاب
            let updatedText = rawAnnouncementText
                .replace(/\[time\]/g, `<span style="color: #60a5fa; font-family: sans-serif; font-weight: 800; margin: 0 5px;">${formattedTime}</span>`)
                .replace(/\[date\]/g, `<span style="color: #f43f5e; font-weight: 800; margin: 0 5px;">${formattedDate}</span>`);

            targetElement.innerHTML = updatedText;
        }

        // تشغيل تحديث نصوص الشريط الإعلاني بمجرد تحميل الواجهة
        document.addEventListener('DOMContentLoaded', () => {
            updateAnnouncementPlaceholders();
            setInterval(updateAnnouncementPlaceholders, 1000);
        });
    </script>
</body>
</html>
